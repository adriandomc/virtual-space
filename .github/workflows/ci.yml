name: Validate application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:e2e
      - run: npx playwright install --with-deps chromium webkit
      # Each browser gets a fresh isolated server, database and authentication counters.
      - run: npx playwright test --project=chromium --output=test-results/chromium
      - run: npx playwright test --project=webkit --output=test-results/webkit
      - run: docker build -t virtual-space:validated .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
